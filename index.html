      // =========================================================================
      // 10. NATIVE SHARE & EXPORT SHAREABLE PNG STRIP (HTML5 CANVAS)
      // =========================================================================

      /**
       * Render a high-resolution shareable comic strip canvas for a game.
       */
      async function buildComicStripCanvas(game) {
        const pages = game.pages;
        const cols = pages.length >= 4 ? 2 : 1;
        const rows = Math.ceil(pages.length / cols);

        const pad = 44;
        const gap = 30;
        const panelW = 540;
        const imgH = 405;
        const panelH = imgH + 112;
        const headerH = 140;
        const footerH = 56;

        const canvasW = pad * 2 + cols * panelW + (cols - 1) * gap;
        const canvasH = headerH + rows * panelH + (rows - 1) * gap + footerH;

        const canvas = document.createElement('canvas');
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext('2d');

        // Cream sketchbook background
        ctx.fillStyle = '#FAF6EE';
        ctx.fillRect(0, 0, canvasW, canvasH);

        // Subtle dotted paper texture
        ctx.fillStyle = 'rgba(30,41,59,0.06)';
        for (let x = 20; x < canvasW; x += 28) {
          for (let y = 20; y < canvasH; y += 28) {
            ctx.fillRect(x, y, 2, 2);
          }
        }

        // Title Header
        ctx.fillStyle = '#1E293B';
        ctx.font = '800 38px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(game.title || 'Telestrations Journal', canvasW / 2, 58, canvasW - 80);

        ctx.fillStyle = '#64748B';
        ctx.font = '600 20px Inter, sans-serif';
        const subtitle = [game.owner, formatDate(game.createdAt), `${pages.length} Pages`].filter(Boolean).join('  ·  ');
        ctx.fillText(subtitle, canvasW / 2, 102, canvasW - 80);

        // Load all page images
        const loadedImgs = await Promise.all(
          pages.map(
            (p) =>
              new Promise((res) => {
                const im = new Image();
                im.onload = () => res(im);
                im.onerror = () => res(null);
                im.src = p.imageData;
              })
          )
        );

        // Draw each panel
        pages.forEach((page, idx) => {
          const col = idx % cols;
          const row = Math.floor(idx / cols);
          const x = pad + col * (panelW + gap);
          const y = headerH + row * (panelH + gap);
          const isDerail = page.id === game.derailmentPageId;

          // Card container
          ctx.fillStyle = '#FFFFFF';
          ctx.strokeStyle = isDerail ? '#F59E0B' : '#CBD5E1';
          ctx.lineWidth = isDerail ? 6 : 3;
          ctx.beginPath();
          ctx.roundRect(x, y, panelW, panelH, 22);
          ctx.fill();
          ctx.stroke();

          // Page image fitted cleanly inside frame
          const im = loadedImgs[idx];
          if (im) {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(x + 14, y + 14, panelW - 28, imgH - 14, 14);
            ctx.clip();
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(x + 14, y + 14, panelW - 28, imgH - 14);

            const boxW = panelW - 28;
            const boxH = imgH - 14;
            const ratio = Math.min(boxW / im.width, boxH / im.height);
            const dw = im.width * ratio;
            const dh = im.height * ratio;
            ctx.drawImage(im, x + 14 + (boxW - dw) / 2, y + 14 + (boxH - dh) / 2, dw, dh);
            ctx.restore();
          }

          // Type Pill
          const pillColor = page.type === 'sketch' ? '#EF4444' : idx === 0 ? '#2563EB' : '#0D9488';
          ctx.fillStyle = pillColor;
          ctx.beginPath();
          ctx.roundRect(x + 22, y + 22, 170, 32, 16);
          ctx.fill();
          ctx.fillStyle = '#FFFFFF';
          ctx.font = '800 15px Inter, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(getPageLabel(idx, page.type).toUpperCase(), x + 107, y + 39);

          // Derailment Crown Badge
          if (isDerail) {
            ctx.fillStyle = '#F59E0B';
            ctx.beginPath();
            ctx.roundRect(x + panelW - 188, y + 22, 166, 32, 16);
            ctx.fill();
            ctx.fillStyle = '#1E293B';
            ctx.font = '800 14px Inter, sans-serif';
            ctx.fillText('👑 DERAILMENT!', x + panelW - 105, y + 39);
          }

          // Caption Text
          ctx.fillStyle = '#1E293B';
          ctx.font = 'bold 30px "Patrick Hand", cursive, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(page.caption || getShortPageType(idx, page.type), x + panelW / 2, y + imgH + 46, panelW - 40);

          if (page.author) {
            ctx.fillStyle = '#94A3B8';
            ctx.font = '700 15px Inter, sans-serif';
            ctx.fillText(`— ${page.author}`, x + panelW / 2, y + imgH + 80, panelW - 40);
          }
        });

        // Footer watermark
        ctx.fillStyle = '#94A3B8';
        ctx.font = '700 16px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Created with Telestrations Vault', canvasW / 2, canvasH - 24);

        const slug = (game.title || 'journal')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '')
          .slice(0, 40);
        const filename = `telestrations-${slug || 'strip'}.png`;

        return { canvas, filename };
      }

      /**
       * Trigger direct PNG file download from a canvas.
       */
      function downloadCanvasAsPng(canvas, filename) {
        const link = document.createElement('a');
        link.download = filename;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }

      /**
       * Download the generated comic strip PNG directly.
       */
      async function exportGameAsPngStrip(game) {
        if (!game || !game.pages || game.pages.length === 0) return;
        showToast('Generating PNG strip...', 'dark');
        try {
          const { canvas, filename } = await buildComicStripCanvas(game);
          downloadCanvasAsPng(canvas, filename);
          showToast('PNG strip downloaded!', 'success');
        } catch (err) {
          showToast('Could not export PNG strip.', 'error');
        }
      }

      /**
       * Share the generated comic strip PNG via the native Web Share API
       * (Messages, AirDrop, Save Image on iOS/Android), with automatic download fallback.
       */
      async function shareGameAsPngStrip(game) {
        if (!game || !game.pages || game.pages.length === 0) return;
        showToast('Preparing comic strip to share...', 'dark');

        try {
          const { canvas, filename } = await buildComicStripCanvas(game);
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
          if (!blob) throw new Error('PNG encoding failed');

          const file = new File([blob], filename, { type: 'image/png' });
          const shareData = {
            files: [file],
            title: game.title || 'Telestrations Strip',
            text: game.notes
              ? `${game.title} — "${game.notes}"`
              : `Check out our Telestrations round: ${game.title || 'Game Night'}!`,
          };

          if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
            try {
              await navigator.share(shareData);
              showToast('Comic strip shared!', 'success');
              return;
            } catch (shareErr) {
              // User dismissed the share sheet intentionally
              if (shareErr && shareErr.name === 'AbortError') return;
            }
          }

          // Graceful fallback when native file sharing is unsupported
          downloadCanvasAsPng(canvas, filename);
          showToast('Native share unavailable — downloaded PNG instead!', 'warn');
        } catch (err) {
          showToast('Could not prepare comic strip.', 'error');
        }
      }
